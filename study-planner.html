  // 사이드패널 썸네일과 같은 renderThumb()으로 원하는 크기에 축소해 넣는다.
  const _ngInsertCards = {};
  function ngInsertCard(kind) {
    if (_ngInsertCards[kind]) return _ngInsertCards[kind];
    const t = new Date();
    let card;
    if (kind === 'weekly') {
      card = buildWeekSpreadEl(t);
    } else if (kind === 'monthly') {
      card = buildMonthGridEl(t.getFullYear(), t.getMonth() + 1);
    } else {
      // 샘플 공부시간을 넣어 타임라인·과목 시간이 채워진 모습으로 보여준다
      const page = {
        id: 'ng-insert-preview',
        dateText: `${String(t.getFullYear()).slice(2)}.${String(t.getMonth() + 1).padStart(2, '0')}.${String(t.getDate()).padStart(2, '0')}`,
        studyTime: '4:12:30',
      };
      const holder = document.createElement('div');
      holder.innerHTML = buildCardHTML(page);
      card = holder.firstElementChild;
      buildGrid(card, studyBreakdown(page).fills);
      lucide.createIcons({ nodes: [card] });
    }
    _ngInsertCards[kind] = card;
    return card;
  }
  function ngRenderInsertThumb(kind, hostEl) {
    if (hostEl) renderThumb(ngInsertCard(kind), hostEl);
  }

  const ngScreen  = document.getElementById('noteGalleryScreen');
  const ndScreen  = document.getElementById('noteDetailScreen');
  const ngGridEl  = document.getElementById('ngGrid');
  let ngCategory  = NG_CATEGORIES[0];
  let ndTemplate  = null; // 상세 화면에 열려 있는 템플릿

  function ngFindTemplate(id) { return NOTE_TEMPLATES.find(t => t.id === id); }

  function ngRenderPills() {
    document.getElementById('ngPills').innerHTML = NG_CATEGORIES.map(c =>
      `<button class="fp-pill ${c === ngCategory ? 'on' : ''}" data-cat="${c}">${c}</button>`).join('');
  }

  function ngRenderGrid() {
    const list = ngCategory === '전체'
      ? NOTE_TEMPLATES
      : NOTE_TEMPLATES.filter(t => t.category === ngCategory);

    ngGridEl.classList.toggle('ng-grid-empty', !list.length);
    if (!list.length) {
      ngGridEl.innerHTML = `<div class="ng-placeholder">준비 중이에요</div>`;
      return;
    }
    ngGridEl.innerHTML = list.map(t => StoreCard.html({
      bg: coverOf(t.coverId).tint,
      badge: t.badge,
      name: t.name,
      desc: t.desc,
      attrs: { 'data-tpl': t.id },
    })).join('');
    // 각 카드 썸네일에 그 노트의 실제 속지 디자인을 축소해 넣는다
    list.forEach(t => {
      const host = ngGridEl.querySelector(`[data-tpl="${t.id}"] .stc-preview`);
      ngRenderInsertThumb(NG_INSERT[t.category].kind, host);
    });
  }

  function openNoteGallery() {
    ngRenderPills();
    ngRenderGrid();
    ngScreen.querySelector('.ng-body').scrollTop = 0;
    ngScreen.classList.add('visible');
    lucide.createIcons({ nodes: [ngScreen] });
  }
  function closeNoteGallery() {
    ngScreen.classList.remove('visible');
    closeNoteDetail();
  }

  document.getElementById('hsAddBtn').addEventListener('click', openNoteGallery);
  document.getElementById('ngCloseBtn').addEventListener('click', closeNoteGallery);

  document.getElementById('ngPills').addEventListener('click', e => {
    const pill = e.target.closest('.fp-pill');
    if (!pill) return;
    ngCategory = pill.dataset.cat;
    ngRenderPills();
    ngRenderGrid();
    ngScreen.querySelector('.ng-body').scrollTop = 0;
  });

  ngGridEl.addEventListener('click', e => {
    const card = e.target.closest('.stc');
    if (card) openNoteDetail(card.dataset.tpl);
  });

  // ── 상세 ──────────────────────────────────────────────
  function openNoteDetail(id) {
    const t = ngFindTemplate(id);
    if (!t) return;
    ndTemplate = t;

    const cat = t.category;
    const insert = NG_INSERT[cat];

    const cover = coverOf(t.coverId);
    document.getElementById('ndTopTitle').textContent = t.name;
    document.getElementById('ndHeroBg').style.background = cover.tint;
    document.getElementById('ndHeroCover').innerHTML = NoteCover.html({ width: 210, ...cover });
    document.getElementById('ndHeroSheets').innerHTML = '<div class="nd-hero-sheet"></div>';

    document.getElementById('ndTags').innerHTML =
      [cat, NG_FORMAT_LABEL[t.format], t.badge]
        .map(x => `<span class="ng-tag">${x}</span>`).join('');
    document.getElementById('ndName').textContent = t.name;
    document.getElementById('ndDesc').textContent = t.about || t.desc;

    document.getElementById('ndInsertList').innerHTML = `
      <div class="nd-insert-row">
        <div class="nd-insert-thumb"></div>
        <div class="nd-insert-txt">
          <div class="nd-insert-name">${insert.name}</div>
          <div class="nd-insert-desc">${insert.desc}</div>
        </div>
      </div>`;

    document.getElementById('ndSpec').innerHTML = [
      ['카테고리', cat],
      ['노트 형식', NG_FORMAT_LABEL[t.format]],
      ['속지', `${insert.name} 1종 (고정)`],
      ['이용', t.badge],
      ['지원 기능', '펜슬, 스티커, 타이머 연동, 할일 관리'],
    ].map(([k, v]) => `<div class="nd-spec-row"><div class="nd-spec-key">${k}</div><div class="nd-spec-val">${v}</div></div>`).join('');

    document.getElementById('ndBody').scrollTop = 0;
    ndScreen.classList.add('visible');
    lucide.createIcons({ nodes: [ndScreen] });
    // 히어로와 목록 썸네일 모두 실제 속지 디자인을 축소해 채운다
    ngRenderInsertThumb(insert.kind, ndScreen.querySelector('.nd-hero-sheet'));
    ngRenderInsertThumb(insert.kind, ndScreen.querySelector('.nd-insert-thumb'));
  }

  function closeNoteDetail() {
    ndScreen.classList.remove('visible');
  }
  document.getElementById('ndBackBtn').addEventListener('click', closeNoteDetail);

  // 추가하기 → 홈 노트 목록 맨 앞에 꽂고, 생성 팝업을 띄운 뒤 그 노트를 바로 열어준다
  document.getElementById('ndAddBtn').addEventListener('click', () => {
    const t = ndTemplate;
    if (!t) return;
    const cat = t.category;
    const note = {
      name: t.name,
      date: '방금 전',
      icon: NG_CATEGORY_ICON[cat] || 'file-text',
      coverId: t.coverId,
      noteType: t.format,
    };

    closeNoteDetail();
    closeNoteGallery();

    const cardEl = buildNoteCardEl(note);
    HOME_NOTES.unshift(note);
    hsNotesEl.insertBefore(cardEl, hsNotesEl.firstChild);
    lucide.createIcons({ nodes: [cardEl] });

    nwShowNoteCreated(note.name, coverOf(note.coverId), NG_INSERT[cat].kind);
    openTabFromHome(note.name, note.icon, 'note', note.noteType);
  });

  // ── Home screen ───────────────────────────────────────────
  const homeScreen = document.getElementById('homeScreen');
  const studyBtn   = document.querySelector('.study-btn');
  const tabLabels  = document.querySelector('.tab-labels');
  const tabsSection = document.querySelector('.tabs-section');

  // coverId는 위 NOTE_COVERS의 표지를 가리킨다 — 홈의 "표지 변경"으로 언제든 바꿀 수 있다
  const HOME_NOTES = [
    { name: '데일리 플래너', date: '2일 전', icon: 'sun',            coverId: 'coral',  noteType: 'scroll'  },
    { name: '위클리 플래너', date: '2일 전', icon: 'calendar-range', coverId: 'purple', noteType: 'weekly'  },
    { name: '먼슬리 플래너', date: '2일 전', icon: 'calendar-days',  coverId: 'green',  noteType: 'monthly' },
  ];

  // Build note cards
  const hsNotesEl = document.getElementById('hsNotes');

  function buildNoteCardEl(note) {
    const card = document.createElement('div');
    card.className = 'note-card';
    card.innerHTML = `
      ${NoteCover.html({ width: 170, ...coverOf(note.coverId) })}
      <div class="note-info">
        <div class="txt"><div class="nname">${note.name}</div><div class="ntime">${note.date}</div></div>
        <div class="chev">⌄</div>
      </div>
    `;
    card.addEventListener('click', () => openTabFromHome(note.name, note.icon || 'file-text', 'note', note.noteType || 'scroll'));
    const chevEl = card.querySelector('.chev');
    const nameEl = card.querySelector('.nname');
    chevEl.addEventListener('click', (e) => {
      e.stopPropagation(); // 카드 클릭(노트 열기)과 분리 — 화살표는 메뉴만 연다
      openHomeNoteMenu(chevEl, note, nameEl, card.querySelector('.ncv'));
    });
    return card;
  }

  HOME_NOTES.forEach(note => {
    hsNotesEl.appendChild(buildNoteCardEl(note));
  });

  lucide.createIcons({ nodes: [homeScreen] });

  // ── 홈 노트 메뉴 (화살표 → 이름 변경 / 표지 변경) ──────────
  let homeNoteMenuTarget = null; // { note, nameEl, coverEl }
  const homeNoteMenu = new OverlayMenu({
    items: [
      { lucideIcon: 'pencil', label: '이름 변경', onClick() {
          if (homeNoteMenuTarget) openRenamePopup(homeNoteMenuTarget.note, homeNoteMenuTarget.nameEl);
      } },
      { lucideIcon: 'palette', label: '표지 변경', onClick() {
          if (homeNoteMenuTarget) openCoverPopup(homeNoteMenuTarget.note, homeNoteMenuTarget.coverEl);
      } }
    ]
  });

  function openHomeNoteMenu(chevEl, note, nameEl, coverEl) {
    homeNoteMenuTarget = { note, nameEl, coverEl };
    const r = chevEl.getBoundingClientRect();
    homeNoteMenu.open(r.left + r.width / 2, r.bottom + 4);
  }

  // 이름 변경 팝업 (동적 생성)
  const renameBackdrop = document.createElement('div');
  renameBackdrop.className = 'rn-backdrop';
  const renamePopup = document.createElement('div');
  renamePopup.className = 'rn-popup';
  renamePopup.innerHTML = `
    <div class="rn-title">이름 변경</div>
    <input class="rn-input" type="text" maxlength="40" placeholder="노트 이름">
    <div class="rn-actions">
      <button class="rn-btn rn-cancel">취소</button>
      <button class="rn-btn rn-confirm">확인</button>
    </div>`;
  document.body.appendChild(renameBackdrop);
  document.body.appendChild(renamePopup);
  const renameInput = renamePopup.querySelector('.rn-input');
  let renameTarget = null;

  function openRenamePopup(note, nameEl) {
    renameTarget = { note, nameEl };
    renameInput.value = note.name;
    renameBackdrop.classList.add('visible');
    renamePopup.classList.add('visible');
    setTimeout(() => { renameInput.focus(); renameInput.select(); }, 40);
  }
  function closeRenamePopup() {
    renameBackdrop.classList.remove('visible');
    renamePopup.classList.remove('visible');
    renameTarget = null;
  }
  function confirmRename() {
    const v = renameInput.value.trim();
    if (v && renameTarget) {
      renameTarget.note.name = v;
      renameTarget.nameEl.textContent = v;
    }
    closeRenamePopup();
  }
  renamePopup.querySelector('.rn-confirm').addEventListener('click', confirmRename);
  renamePopup.querySelector('.rn-cancel').addEventListener('click', closeRenamePopup);
  renameBackdrop.addEventListener('click', closeRenamePopup);
  renameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') confirmRename();
    else if (e.key === 'Escape') closeRenamePopup();
  });

  // ── 표지 변경 팝업 (동적 생성) ─────────────────────────────
  // 표지는 NoteCover의 CSS 변수만 갈아끼우면 바뀌므로, 고르는 즉시 홈 카드에 바로 반영해
  // 실물로 확인하고 확인/취소로 확정하거나 되돌린다.
  const coverBackdrop = document.createElement('div');
  coverBackdrop.className = 'cv-backdrop';
  const coverPopup = document.createElement('div');
  coverPopup.className = 'cv-popup';
  // 네비바는 공용 컴포넌트(components/modal-header.css) — 닫기(X) + 제목 + 확정(체크)
  coverPopup.innerHTML = `
    <div class="bsm-header">
      <button class="bsm-close-btn cv-cancel" aria-label="닫기"><i data-lucide="x" style="width:20px;height:20px;"></i></button>
      <span class="bsm-title">표지 변경</span>
      <button class="bsm-confirm-btn cv-confirm" aria-label="확인"><i data-lucide="check" style="width:20px;height:20px;"></i></button>
    </div>
    <div class="fp-row cv-pills"></div>
    <div class="cv-grid"></div>`;
  document.body.appendChild(coverBackdrop);
  document.body.appendChild(coverPopup);
  lucide.createIcons({ nodes: [coverPopup] });
  const coverPills = coverPopup.querySelector('.cv-pills');
  const coverGrid = coverPopup.querySelector('.cv-grid');
  let coverTarget = null; // { note, coverEl, originalId }
  let coverTag = NOTE_COVER_TAGS[0];

  function applyCoverToCard(coverEl, coverId) {
    if (coverEl) coverEl.setAttribute('style', NoteCover.vars({ width: 170, ...coverOf(coverId) }));
  }

  function renderCoverPills() {
    coverPills.innerHTML = NOTE_COVER_TAGS.map(tag =>
      `<button class="fp-pill ${tag === coverTag ? 'on' : ''}" data-tag="${tag}">${tag}</button>`).join('');
  }

  function renderCoverGrid(selectedId) {
    const list = NOTE_COVERS.filter(c => c.tag === coverTag);
    coverGrid.classList.toggle('cv-grid-empty', !list.length);
    if (!list.length) {
      coverGrid.innerHTML = `<div class="cv-placeholder">${NOTE_COVER_EMPTY_TEXT[coverTag] || '준비 중이에요'}</div>`;
      return;
    }
    coverGrid.innerHTML = list.map(c => `
      <div class="cv-cell ${c.id === selectedId ? 'on' : ''}" data-cover="${c.id}">
        <div class="cv-cell-face">
          ${NoteCover.html({ width: 156, ...c })}
          <div class="cv-check"><i data-lucide="check" style="width:15px;height:15px;color:#fff;"></i></div>
        </div>
        <div class="cv-name">${c.name}</div>
      </div>`).join('');
    lucide.createIcons({ nodes: [coverGrid] });
  }

  function openCoverPopup(note, coverEl) {
    coverTarget = { note, coverEl, originalId: note.coverId };
    coverTag = coverOf(note.coverId).tag || NOTE_COVER_TAGS[0]; // 현재 표지가 있는 탭으로 열어준다
    renderCoverPills();
    renderCoverGrid(note.coverId);
    coverGrid.scrollTop = 0;
    coverBackdrop.classList.add('visible');
    coverPopup.classList.add('visible');
  }
  function closeCoverPopup() {
    coverBackdrop.classList.remove('visible');
    coverPopup.classList.remove('visible');
    coverTarget = null;
  }
  function cancelCoverPopup() {
    if (coverTarget) {
      coverTarget.note.coverId = coverTarget.originalId; // 미리보기로 바꿔둔 값을 원래대로
      applyCoverToCard(coverTarget.coverEl, coverTarget.originalId);
    }
    closeCoverPopup();
  }

  coverPills.addEventListener('click', e => {
    const pill = e.target.closest('.fp-pill');
    if (!pill || !coverTarget) return;
    coverTag = pill.dataset.tag;
    renderCoverPills();
    renderCoverGrid(coverTarget.note.coverId);
    coverGrid.scrollTop = 0;
  });

  coverGrid.addEventListener('click', e => {
    const cell = e.target.closest('.cv-cell');
    if (!cell || !coverTarget) return;
    coverTarget.note.coverId = cell.dataset.cover;
    applyCoverToCard(coverTarget.coverEl, cell.dataset.cover); // 홈 카드에 즉시 미리보기
    renderCoverGrid(cell.dataset.cover);
  });
  coverPopup.querySelector('.cv-confirm').addEventListener('click', () => {
    if (coverTarget) pageToast.show('표지가 변경되었습니다');
    closeCoverPopup();
  });
  coverPopup.querySelector('.cv-cancel').addEventListener('click', cancelCoverPopup);
  coverBackdrop.addEventListener('click', cancelCoverPopup);

  // ── Home screen show / hide ────────────────────────────
  studyBtn.addEventListener('click', () => {
    if (homeScreen.classList.contains('hs-visible')) {
      closeHomeScreen();
    } else {
      openHomeScreen();
    }
  });

  function openHomeScreen()  { homeScreen.classList.add('hs-visible'); }
  function closeHomeScreen() { homeScreen.classList.remove('hs-visible'); }

  // ── Tab management ─────────────────────────────────────

  // Delegated handler: close button = last child of .tab-inner; body = activate
  tabLabels.addEventListener('click', e => {
    const tab = e.target.closest('.tab');
    if (!tab) return;
    const tabInner = tab.querySelector('.tab-inner');
    const closeEl  = tabInner?.lastElementChild;
    if (closeEl && (e.target === closeEl || closeEl.contains(e.target))) {
      e.stopPropagation();
      removeTab(tab);
      return;
    }
    setTabActive(tab);
  });

  // Recalculate z-indices and margins after any tab change
  function refreshTabLayout() {
    const tabs = Array.from(tabLabels.querySelectorAll('.tab'));
    const n = tabs.length;
    tabs.forEach((tab, i) => {
      // Active tab always on top; others: leftmost highest
      tab.style.zIndex     = tab.classList.contains('active') ? String(n + 1) : String(n - i);
      tab.style.marginRight = i === n - 1 ? '0' : '-30px';
    });
  }

  function setTabActive(tab) {
    tabLabels.querySelectorAll('.tab').forEach(t => {
      const isTarget = t === tab;
      t.classList.toggle('active', isTarget);
      t.querySelector('.tab-inner')?.classList.toggle('dim', !isTarget);
      t.querySelector('.tab-label')?.classList.toggle('dim', !isTarget);
      const curves = t.querySelectorAll('.tab-curve');
      const prefix = isTarget ? 'active' : 'inactive';
      if (curves[0]) curves[0].src = `assets/tab-${prefix}-left.svg`;
      if (curves[1]) curves[1].src = `assets/tab-${prefix}-right.svg`;
      const shadow = t.querySelector('.tab-shadow');
      if (shadow) {
        shadow.innerHTML = isTarget
          ? ''
          : '<img src="assets/tab-shadow.svg" style="position:absolute;inset:0;width:100%;height:100%;">';
      }
      const iconColor = isTarget ? 'rgba(0,0,0,0.86)' : 'rgba(0,0,0,0.4)';
      t.querySelectorAll('.tab-inner svg').forEach(svg => { svg.style.color = iconColor; });
    });
    refreshTabLayout();
    updateView();
  }

  function removeTab(tabEl) {
    const tabs     = Array.from(tabLabels.querySelectorAll('.tab'));
    const wasActive = tabEl.classList.contains('active');
    const idx      = tabs.indexOf(tabEl);
    tabEl.remove();
    const remaining = Array.from(tabLabels.querySelectorAll('.tab'));

    if (remaining.length === 0) {
      openHomeScreen();
      updateView();
      return;
    }

    refreshTabLayout();

    if (wasActive) {
      const next = remaining[Math.min(idx, remaining.length - 1)];
      setTabActive(next);
    }
  }

  // ── View switching (toolbar + placeholder) ─────────────
  const toolbar          = document.querySelector('.toolbar');
  const workspaceEl      = document.getElementById('workspace');
  const viewPlaceholder  = document.getElementById('viewPlaceholder');
  const viewPlaceholderLabel = document.getElementById('viewPlaceholderLabel');

  function updateView() {
    const activeTab = tabLabels.querySelector('.tab.active');
    const isQuick   = activeTab?.dataset.tabType === 'quick';
    const noteType  = activeTab?.dataset.noteType || 'scroll'; // scroll/calendar/weekly/monthly
    const tabName   = activeTab?.dataset.tabName  || '';

    toolbar.style.display        = isQuick ? 'none' : '';
    workspaceEl.style.height     = isQuick ? 'calc(100vh - 36px)' : 'calc(100vh - 86px)';
    viewPlaceholder.style.display = isQuick ? 'flex' : 'none';
    viewPlaceholderLabel.textContent = isQuick ? tabName : '';

    if (!isQuick) setCanvasMode(noteType, activeTab);
  }

  function openTabFromHome(name, icon, type, noteType) {
    closeHomeScreen();
    addHomeTab(name, icon, type || 'note', noteType);
  }

  function addHomeTab(name, icon, type, noteType) {
    // Deactivate current active tab
    const prevActive = tabLabels.querySelector('.tab.active');
    if (prevActive) setTabActive(null); // clear all active states first

    // Build new active tab element
    const newTab = document.createElement('div');
    newTab.className = 'tab active';
    newTab.dataset.tabType = type;
    newTab.dataset.tabName = name;
    newTab.dataset.noteType = noteType || 'scroll';
    if (newTab.dataset.noteType === 'calendar') {
      const t = new Date();
      newTab._calState = {
        pages: new Map(), // dateText -> cached card element
        activeDateText: `${String(t.getFullYear()).slice(2)}.${String(t.getMonth() + 1).padStart(2, '0')}.${String(t.getDate()).padStart(2, '0')}`,
        year: t.getFullYear(),
        month: t.getMonth() + 1,
        picker: null,
      };
    }
    newTab.innerHTML = `
      <img class="tab-curve" src="assets/tab-active-left.svg" style="width:29px;height:36px;flex-shrink:0;display:block;">
      <div class="tab-inner">
        <i data-lucide="${icon}" style="width:16px;height:16px;flex-shrink:0;color:rgba(0,0,0,0.86);"></i>
        <span class="tab-label">${name}</span>
        <i data-lucide="x" style="width:16px;height:16px;flex-shrink:0;color:rgba(0,0,0,0.86);"></i>
      </div>
      <img class="tab-curve" src="assets/tab-active-right.svg" style="width:29px;height:36px;flex-shrink:0;display:block;transform:scaleX(-1);">
      <div class="tab-shadow"></div>
    `;
    tabLabels.appendChild(newTab);
    lucide.createIcons({ nodes: [newTab] });

    // Deactivate all others now that new tab is in DOM
    tabLabels.querySelectorAll('.tab:not(.active)').forEach(t => {
      t.querySelector('.tab-inner')?.classList.add('dim');
      t.querySelector('.tab-label')?.classList.add('dim');
      const curves = t.querySelectorAll('.tab-curve');
      if (curves[0]) curves[0].src = 'assets/tab-inactive-left.svg';
      if (curves[1]) curves[1].src = 'assets/tab-inactive-right.svg';
      const shadow = t.querySelector('.tab-shadow');
      if (shadow && !shadow.querySelector('img')) {
        shadow.innerHTML = '<img src="assets/tab-shadow.svg" style="position:absolute;inset:0;width:100%;height:100%;">';
      }
      t.querySelectorAll('.tab-inner svg').forEach(svg => { svg.style.color = 'rgba(0,0,0,0.4)'; });
    });

    refreshTabLayout();
    updateView();
    if (tabsSection) tabsSection.scrollLeft = tabsSection.scrollWidth;
  }

  // Initialise z-index / margin on the static tabs already in HTML
  refreshTabLayout();
  updateView();

  // ── 오늘로 이동 플로팅 버튼: 오늘자 페이지가 캔버스 스크롤 영역 밖으로 나가면
  //    나타나고, 누르면 그 위치로 스크롤한다 ──
  const todayFabBtn = document.getElementById('todayFabBtn');
  function getTodayCardEl() {
    // 데일리 스크롤 노트에서만 '오늘로 이동' 대상이 있다 (calendar/weekly/monthly는 제외)
    if ((canvasZoomWrap.dataset.mode || 'scroll') !== 'scroll') return null;
    const t = new Date();
    return Array.from(canvasZoomWrap.querySelectorAll('.card[data-canvas-state="with-date"]'))
      .find(c => parseCardDate(c).toDateString() === t.toDateString()) || null;
  }
  todayFabBtn.addEventListener('click', () => {
    const el = getTodayCardEl();
    if (!el) return;
    const target = el.offsetTop - CENTER_OFFSET();
    mainArea.scrollTo({ top: Math.max(0, target), behavior: 'smooth' });
  });
  let todayFabObserver = null;
  function watchTodayFab() {
    const el = getTodayCardEl();
    if (!el) { todayFabBtn.classList.remove('visible'); return; }
    if (todayFabObserver) todayFabObserver.disconnect();
    todayFabObserver = new IntersectionObserver(([entry]) => {
      todayFabBtn.classList.toggle('visible', !entry.isIntersecting);
      // 오늘 페이지가 현재 화면보다 위에 있으면 버튼도 위쪽에, 아래에 있으면 아래쪽에 뜬다
      const isAbove = entry.boundingClientRect.top < entry.rootBounds.top;
      todayFabBtn.classList.toggle('pos-top', isAbove);
    }, { root: mainArea, threshold: 0 });
    todayFabObserver.observe(el);
  }
  window.watchTodayFab = watchTodayFab; // setCanvasMode(탭 전환)에서 재호출할 수 있도록 노출
  window.__todayFabReady = true; // 함수 선언은 호이스팅되어 이 지점 이전에도 typeof가 'function'이므로, 준비 여부는 별도 플래그로 판단한다
  // 초기 레이아웃/스크롤이 확정된 뒤에 연결해야 최초 관찰 시점의 스크롤 위치로 잘못 판정하지 않는다
  requestAnimationFrame(() => requestAnimationFrame(watchTodayFab));

  // ── Drawing system ────────────────────────────────────────────
  const DRAW_COLOR  = 'rgba(0,0,0,0.78)';
  const DRAW_WIDTH  = 2.5;
  const ERASE_WIDTH = 28;

  let drawTool = 'pencil'; // 'pencil' | 'eraser' | null
  let drawingActive = false;
  let drawCv = null, drawCtx = null;
  let drawX = 0, drawY = 0;
  let lastDrawCv = null;

  const drawHistory = new WeakMap(); // canvas → { undo: [], redo: [] }
  function drawHist(cv) {
    if (!drawHistory.has(cv)) drawHistory.set(cv, { undo: [], redo: [] });
    return drawHistory.get(cv);
  }
  function drawSnap(cv) {
    const h = drawHist(cv);
    const snap = cv.getContext('2d').getImageData(0, 0, cv.width, cv.height);
    h.undo.push(snap);
    if (h.undo.length > 60) h.undo.shift();
    h.redo = [];
  }

  function setDrawTool(tool) {
    drawTool = tool;
    document.body.classList.toggle('tool-pencil', tool === 'pencil');
    document.body.classList.toggle('tool-eraser', tool === 'eraser');
    document.body.classList.toggle('tool-hand',   tool === null);
    document.getElementById('toolPencil').classList.toggle('active', tool === 'pencil');
    document.getElementById('toolEraser').classList.toggle('active', tool === 'eraser');
    document.getElementById('toolPenLine').classList.toggle('active', false);
    if (tool === 'pencil' || tool === 'eraser') {
      document.querySelectorAll('.om-backdrop:not(.om-hidden)').forEach(el => el.click());
    }
  }

  document.getElementById('toolPencil').addEventListener('click', () => {
    setDrawTool(drawTool === 'pencil' ? null : 'pencil');
  });
  document.getElementById('toolEraser').addEventListener('click', () => setDrawTool('eraser'));
  document.getElementById('toolPenLine').addEventListener('click', () => setDrawTool(null));

  document.getElementById('toolUndo').addEventListener('click', () => {
    const cv = lastDrawCv; if (!cv) return;
    const h = drawHist(cv); if (!h.undo.length) return;
    h.redo.push(cv.getContext('2d').getImageData(0, 0, cv.width, cv.height));
    cv.getContext('2d').putImageData(h.undo.pop(), 0, 0);
  });
  document.getElementById('toolRedo').addEventListener('click', () => {
    const cv = lastDrawCv; if (!cv) return;
    const h = drawHist(cv); if (!h.redo.length) return;
    h.undo.push(cv.getContext('2d').getImageData(0, 0, cv.width, cv.height));
    cv.getContext('2d').putImageData(h.redo.pop(), 0, 0);
  });

  function canvasPointer(e) {
    const rect = drawCv.getBoundingClientRect();
    const scaleX = drawCv.width  / rect.width;
    const scaleY = drawCv.height / rect.height;
    return {
      x: (e.clientX - rect.left) * scaleX,
      y: (e.clientY - rect.top)  * scaleY,
    };
  }

  function onDrawStart(e) {
    if (!drawTool) return;
    e.preventDefault();
    drawCv  = e.currentTarget;
    drawCtx = drawCv.getContext('2d');
    lastDrawCv = drawCv;
    drawSnap(drawCv);
    const p = canvasPointer(e);
    drawX = p.x; drawY = p.y;
    drawingActive = true;

    drawCtx.beginPath();
    if (drawTool === 'pencil') {
      drawCtx.globalCompositeOperation = 'source-over';
      drawCtx.strokeStyle = DRAW_COLOR;
      drawCtx.lineWidth   = DRAW_WIDTH;
      drawCtx.lineCap     = 'round';
      drawCtx.lineJoin    = 'round';
    } else {
      drawCtx.globalCompositeOperation = 'destination-out';
      drawCtx.lineWidth = ERASE_WIDTH;
      drawCtx.lineCap   = 'round';
      drawCtx.lineJoin  = 'round';
    }
    drawCtx.moveTo(drawX, drawY);
  }

  function onDrawMove(e) {
    if (!drawingActive || !drawCtx) return;
    e.preventDefault();
    const p = canvasPointer(e);
    const mx = (drawX + p.x) / 2;
    const my = (drawY + p.y) / 2;
    drawCtx.quadraticCurveTo(drawX, drawY, mx, my);
    drawCtx.stroke();
    drawCtx.beginPath();
    drawCtx.moveTo(mx, my);
    drawX = p.x; drawY = p.y;
  }

  function onDrawEnd(e) {
    if (!drawingActive) return;
    drawingActive = false;
    if (drawCtx) {
      drawCtx.globalCompositeOperation = 'source-over';
      drawCtx.beginPath();
    }
    updateAllThumbs();
  }

  // Attach listeners to all existing + future canvases via delegation
  document.addEventListener('pointerdown', e => {
    if (e.target.classList.contains('card-draw-canvas')) onDrawStart(e);
  });
  document.addEventListener('pointermove', e => {
    if (drawingActive) onDrawMove(e);
  });
  document.addEventListener('pointerup',   onDrawEnd);
  document.addEventListener('pointerleave', onDrawEnd);

  // Start in hand mode (click pencil to start drawing)
  setDrawTool(null);

  // ── Sticker Picker + placement ───────────────────────────────
  let activeStkEl    = null;
  let stkDragState   = null;

  function getVisibleCard() {
    let best = null, bestArea = 0;
    document.querySelectorAll('.card').forEach(card => {
      const r = card.getBoundingClientRect();
      const area = Math.max(0, Math.min(r.bottom, window.innerHeight) - Math.max(r.top, 0))
                 * Math.max(0, Math.min(r.right,  window.innerWidth)  - Math.max(r.left, 0));
      if (area > bestArea) { bestArea = area; best = card; }
    });
    return best;
  }

  function selectStk(el) {
    if (activeStkEl && activeStkEl !== el) activeStkEl.classList.remove('stk-selected');
    activeStkEl = el;
    el?.classList.add('stk-selected');
  }

  function deselectStk() {
    activeStkEl?.classList.remove('stk-selected');
    activeStkEl = null;
  }

  function placeSticker(emoji) {
    const card = getVisibleCard();
    if (!card) return;
    const el = document.createElement('div');
    el.className = 'card-sticker';
    el.innerHTML = `${emoji}<div class="stk-rot-line"></div><div class="stk-rot-handle"></div><div class="stk-del-btn">✕</div>`;
    el._rot = 0;
    el.style.left = (card.offsetWidth  / 2 - 24) + 'px';
    el.style.top  = (card.offsetHeight / 2 - 24) + 'px';
    card.appendChild(el);
    selectStk(el);
    updateAllThumbs();
  }

  // Pointer events for sticker drag & rotate
  document.addEventListener('pointerdown', e => {
    if (document.body.classList.contains('tool-pencil') || document.body.classList.contains('tool-eraser')) return;

    const delBtn  = e.target.closest('.stk-del-btn');
    const handle  = e.target.closest('.stk-rot-handle');
    const sticker = e.target.closest('.card-sticker');

    if (delBtn) {
      e.stopPropagation();
      const el = delBtn.closest('.card-sticker');
      if (activeStkEl === el) activeStkEl = null;
      el.remove();
      updateAllThumbs();
      return;
    }

    if (handle) {
      e.stopPropagation();
      const el = handle.closest('.card-sticker');
      selectStk(el);
      const r = el.getBoundingClientRect();
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      stkDragState = { type: 'rotate', el, cx, cy,
        startAngle: Math.atan2(e.clientY - cy, e.clientX - cx),
        startRot: el._rot };
      return;
    }

    if (sticker) {
      e.stopPropagation();
      selectStk(sticker);
      stkDragState = { type: 'move', el: sticker,
        startX: e.clientX, startY: e.clientY,
        startLeft: parseFloat(sticker.style.left),
        startTop:  parseFloat(sticker.style.top) };
      return;
    }

    deselectStk();
  }, true);

  document.addEventListener('pointermove', e => {
    if (!stkDragState) return;
    const { type, el } = stkDragState;
    if (type === 'move') {
      el.style.left = (stkDragState.startLeft + e.clientX - stkDragState.startX) + 'px';
      el.style.top  = (stkDragState.startTop  + e.clientY - stkDragState.startY) + 'px';
    } else {
      const a = Math.atan2(e.clientY - stkDragState.cy, e.clientX - stkDragState.cx);
      el._rot = stkDragState.startRot + (a - stkDragState.startAngle) * 180 / Math.PI;
      el.style.transform = `rotate(${el._rot}deg)`;
    }
  });

  document.addEventListener('pointerup', () => { stkDragState = null; });

  const stickerPicker = new StickerPicker();
  stickerPicker.onSelect = placeSticker;
  document.getElementById('toolSticker').addEventListener('click', function() {
    stickerPicker.toggle(this);
  });

  // ── Canvas pinch / trackpad zoom ─────────────────────────
  (function() {
    const wrap    = canvasZoomWrap;
    const spacer  = document.getElementById('canvasZoomSpacer');
    const MIN_ZOOM = 0.4, MAX_ZOOM = 2.5;
    let zoom = 1;
    let naturalH = 0;

    // Measure natural height after first render
    requestAnimationFrame(() => { naturalH = wrap.offsetHeight; });

    function applyZoom(z) {
      zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, z));
      wrap.style.transform = `scale(${zoom})`;
      spacer.style.height = Math.max(0, naturalH * (zoom - 1)) + 'px';
    }

    // ── Prevent browser pinch-zoom page-wide (iOS Safari ignores viewport user-scalable)
    document.addEventListener('touchmove', e => {
      if (e.touches.length > 1) e.preventDefault();
    }, { passive: false });

    // ── Trackpad pinch (Ctrl+Wheel — Mac/iPad Magic Keyboard)
    canvasScroll.addEventListener('wheel', e => {
      if (!e.ctrlKey) return;
      e.preventDefault();
      const delta = e.deltaY * (e.deltaMode === 1 ? 0.05 : 0.002);
      applyZoom(zoom * (1 - delta));
    }, { passive: false });

    // ── Safari gesture API (iOS Safari primary handler)
    let gestureInitZoom = 1;
    canvasScroll.addEventListener('gesturestart', e => {
      e.preventDefault();
      gestureInitZoom = zoom;
    }, { passive: false });
    canvasScroll.addEventListener('gesturechange', e => {
      e.preventDefault();
      applyZoom(gestureInitZoom * e.scale);
    }, { passive: false });
    canvasScroll.addEventListener('gestureend', e => {
      e.preventDefault();
    }, { passive: false });

    // ── Touch pinch (Chrome / Android fallback)
    let initDist = null, initZoom = 1;
    canvasScroll.addEventListener('touchstart', e => {
      if (e.touches.length === 2) {
        e.preventDefault();
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        initDist = Math.hypot(dx, dy);
        initZoom = zoom;
      }
    }, { passive: false });

    canvasScroll.addEventListener('touchmove', e => {
      if (e.touches.length === 2 && initDist !== null) {
        e.preventDefault();
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const dist = Math.hypot(dx, dy);
        applyZoom(initZoom * (dist / initDist));
      }
    }, { passive: false });

    canvasScroll.addEventListener('touchend', e => {
      if (e.touches.length < 2) initDist = null;
    }, { passive: true });
  })();

</script>
</body>
</html>
