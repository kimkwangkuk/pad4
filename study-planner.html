    if (tabsSection) tabsSection.scrollLeft = tabsSection.scrollWidth;
  }

  // Initialise z-index / margin on the static tabs already in HTML
  refreshTabLayout();
  updateView();

  // ── Drawing system ────────────────────────────────────────────
  const DRAW_COLOR  = 'rgba(0,0,0,0.78)';
  const DRAW_WIDTH  = 2.5;
  const ERASE_WIDTH = 28;

  let drawTool = 'pencil'; // 'pencil' | 'eraser' | null
  let drawingActive = false;
  let drawCv = null, drawCtx = null;
  let drawX = 0, drawY = 0;
  let lastDrawCv = null;

  const drawHistory = new WeakMap(); // canvas → { undo: [], redo: [] }
  function drawHist(cv) {
    if (!drawHistory.has(cv)) drawHistory.set(cv, { undo: [], redo: [] });
    return drawHistory.get(cv);
  }
  function drawSnap(cv) {
    const h = drawHist(cv);
    const snap = cv.getContext('2d').getImageData(0, 0, cv.width, cv.height);
    h.undo.push(snap);
    if (h.undo.length > 60) h.undo.shift();
    h.redo = [];
  }

  function setDrawTool(tool) {
    drawTool = tool;
    document.body.classList.toggle('tool-pencil', tool === 'pencil');
    document.body.classList.toggle('tool-eraser', tool === 'eraser');
    document.body.classList.toggle('tool-hand',   tool === null);
    document.getElementById('toolPencil').classList.toggle('active', tool === 'pencil');
    document.getElementById('toolEraser').classList.toggle('active', tool === 'eraser');
    document.getElementById('toolPenLine').classList.toggle('active', false);
    if (tool === 'pencil' || tool === 'eraser') {
      document.querySelectorAll('.om-backdrop:not(.om-hidden)').forEach(el => el.click());
    }
  }

  document.getElementById('toolPencil').addEventListener('click', () => {
    setDrawTool(drawTool === 'pencil' ? null : 'pencil');
  });
  document.getElementById('toolEraser').addEventListener('click', () => setDrawTool('eraser'));
  document.getElementById('toolPenLine').addEventListener('click', () => setDrawTool(null));

  document.getElementById('toolUndo').addEventListener('click', () => {
    const cv = lastDrawCv; if (!cv) return;
    const h = drawHist(cv); if (!h.undo.length) return;
    h.redo.push(cv.getContext('2d').getImageData(0, 0, cv.width, cv.height));
    cv.getContext('2d').putImageData(h.undo.pop(), 0, 0);
  });
  document.getElementById('toolRedo').addEventListener('click', () => {
    const cv = lastDrawCv; if (!cv) return;
    const h = drawHist(cv); if (!h.redo.length) return;
    h.undo.push(cv.getContext('2d').getImageData(0, 0, cv.width, cv.height));
    cv.getContext('2d').putImageData(h.redo.pop(), 0, 0);
  });

  function canvasPointer(e) {
    const rect = drawCv.getBoundingClientRect();
    const scaleX = drawCv.width  / rect.width;
    const scaleY = drawCv.height / rect.height;
    return {
      x: (e.clientX - rect.left) * scaleX,
      y: (e.clientY - rect.top)  * scaleY,
    };
  }

  function onDrawStart(e) {
    if (!drawTool) return;
    e.preventDefault();
    drawCv  = e.currentTarget;
    drawCtx = drawCv.getContext('2d');
    lastDrawCv = drawCv;
    drawSnap(drawCv);
    const p = canvasPointer(e);
    drawX = p.x; drawY = p.y;
    drawingActive = true;

    drawCtx.beginPath();
    if (drawTool === 'pencil') {
      drawCtx.globalCompositeOperation = 'source-over';
      drawCtx.strokeStyle = DRAW_COLOR;
      drawCtx.lineWidth   = DRAW_WIDTH;
      drawCtx.lineCap     = 'round';
      drawCtx.lineJoin    = 'round';
    } else {
      drawCtx.globalCompositeOperation = 'destination-out';
      drawCtx.lineWidth = ERASE_WIDTH;
      drawCtx.lineCap   = 'round';
      drawCtx.lineJoin  = 'round';
    }
    drawCtx.moveTo(drawX, drawY);
  }

  function onDrawMove(e) {
    if (!drawingActive || !drawCtx) return;
    e.preventDefault();
    const p = canvasPointer(e);
    const mx = (drawX + p.x) / 2;
    const my = (drawY + p.y) / 2;
    drawCtx.quadraticCurveTo(drawX, drawY, mx, my);
    drawCtx.stroke();
    drawCtx.beginPath();
    drawCtx.moveTo(mx, my);
    drawX = p.x; drawY = p.y;
  }

  function onDrawEnd(e) {
    if (!drawingActive) return;
    drawingActive = false;
    if (drawCtx) {
      drawCtx.globalCompositeOperation = 'source-over';
      drawCtx.beginPath();
    }
    updateAllThumbs();
  }

  // Attach listeners to all existing + future canvases via delegation
  document.addEventListener('pointerdown', e => {
    if (e.target.classList.contains('card-draw-canvas')) onDrawStart(e);
  });
  document.addEventListener('pointermove', e => {
    if (drawingActive) onDrawMove(e);
  });
  document.addEventListener('pointerup',   onDrawEnd);
  document.addEventListener('pointerleave', onDrawEnd);

  // Start in hand mode (click pencil to start drawing)
  setDrawTool(null);

  // ── Sticker Picker + placement ───────────────────────────────
  let activeStkEl    = null;
  let stkDragState   = null;

  function getVisibleCard() {
    let best = null, bestArea = 0;
    document.querySelectorAll('.card').forEach(card => {
      const r = card.getBoundingClientRect();
      const area = Math.max(0, Math.min(r.bottom, window.innerHeight) - Math.max(r.top, 0))
                 * Math.max(0, Math.min(r.right,  window.innerWidth)  - Math.max(r.left, 0));
      if (area > bestArea) { bestArea = area; best = card; }
    });
    return best;
  }

  function selectStk(el) {
    if (activeStkEl && activeStkEl !== el) activeStkEl.classList.remove('stk-selected');
    activeStkEl = el;
    el?.classList.add('stk-selected');
  }

  function deselectStk() {
    activeStkEl?.classList.remove('stk-selected');
    activeStkEl = null;
  }

  function placeSticker(emoji) {
    const card = getVisibleCard();
    if (!card) return;
    const el = document.createElement('div');
    el.className = 'card-sticker';
    el.innerHTML = `${emoji}<div class="stk-rot-line"></div><div class="stk-rot-handle"></div><div class="stk-del-btn">✕</div>`;
    el._rot = 0;
    el.style.left = (card.offsetWidth  / 2 - 24) + 'px';
    el.style.top  = (card.offsetHeight / 2 - 24) + 'px';
    card.appendChild(el);
    selectStk(el);
    updateAllThumbs();
  }

  // Pointer events for sticker drag & rotate
  document.addEventListener('pointerdown', e => {
    if (document.body.classList.contains('tool-pencil') || document.body.classList.contains('tool-eraser')) return;

    const delBtn  = e.target.closest('.stk-del-btn');
    const handle  = e.target.closest('.stk-rot-handle');
    const sticker = e.target.closest('.card-sticker');

    if (delBtn) {
      e.stopPropagation();
      const el = delBtn.closest('.card-sticker');
      if (activeStkEl === el) activeStkEl = null;
      el.remove();
      updateAllThumbs();
      return;
    }

    if (handle) {
      e.stopPropagation();
      const el = handle.closest('.card-sticker');
      selectStk(el);
      const r = el.getBoundingClientRect();
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      stkDragState = { type: 'rotate', el, cx, cy,
        startAngle: Math.atan2(e.clientY - cy, e.clientX - cx),
        startRot: el._rot };
      return;
    }

    if (sticker) {
      e.stopPropagation();
      selectStk(sticker);
      stkDragState = { type: 'move', el: sticker,
        startX: e.clientX, startY: e.clientY,
        startLeft: parseFloat(sticker.style.left),
        startTop:  parseFloat(sticker.style.top) };
      return;
    }

    deselectStk();
  }, true);

  document.addEventListener('pointermove', e => {
    if (!stkDragState) return;
    const { type, el } = stkDragState;
    if (type === 'move') {
      el.style.left = (stkDragState.startLeft + e.clientX - stkDragState.startX) + 'px';
      el.style.top  = (stkDragState.startTop  + e.clientY - stkDragState.startY) + 'px';
    } else {
      const a = Math.atan2(e.clientY - stkDragState.cy, e.clientX - stkDragState.cx);
      el._rot = stkDragState.startRot + (a - stkDragState.startAngle) * 180 / Math.PI;
      el.style.transform = `rotate(${el._rot}deg)`;
    }
  });

  document.addEventListener('pointerup', () => { stkDragState = null; });

  const stickerPicker = new StickerPicker();
  stickerPicker.onSelect = placeSticker;
  document.getElementById('toolSticker').addEventListener('click', function() {
    stickerPicker.toggle(this);
  });

  // ── Canvas pinch / trackpad zoom ─────────────────────────
  (function() {
    const wrap    = canvasZoomWrap;
    const spacer  = document.getElementById('canvasZoomSpacer');
    const MIN_ZOOM = 0.4, MAX_ZOOM = 2.5;
    let zoom = 1;
    let naturalH = 0;

    // Measure natural height after first render
    requestAnimationFrame(() => { naturalH = wrap.offsetHeight; });

    function applyZoom(z) {
      zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, z));
      wrap.style.transform = `scale(${zoom})`;
      spacer.style.height = Math.max(0, naturalH * (zoom - 1)) + 'px';
    }

    // ── Prevent browser pinch-zoom page-wide (iOS Safari ignores viewport user-scalable)
    document.addEventListener('touchmove', e => {
      if (e.touches.length > 1) e.preventDefault();
    }, { passive: false });

    // ── Trackpad pinch (Ctrl+Wheel — Mac/iPad Magic Keyboard)
    canvasScroll.addEventListener('wheel', e => {
      if (!e.ctrlKey) return;
      e.preventDefault();
      const delta = e.deltaY * (e.deltaMode === 1 ? 0.05 : 0.002);
      applyZoom(zoom * (1 - delta));
    }, { passive: false });

    // ── Safari gesture API (iOS Safari primary handler)
    let gestureInitZoom = 1;
    canvasScroll.addEventListener('gesturestart', e => {
      e.preventDefault();
      gestureInitZoom = zoom;
    }, { passive: false });
    canvasScroll.addEventListener('gesturechange', e => {
      e.preventDefault();
      applyZoom(gestureInitZoom * e.scale);
    }, { passive: false });
    canvasScroll.addEventListener('gestureend', e => {
      e.preventDefault();
    }, { passive: false });

    // ── Touch pinch (Chrome / Android fallback)
    let initDist = null, initZoom = 1;
    canvasScroll.addEventListener('touchstart', e => {
      if (e.touches.length === 2) {
        e.preventDefault();
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        initDist = Math.hypot(dx, dy);
        initZoom = zoom;
      }
    }, { passive: false });

    canvasScroll.addEventListener('touchmove', e => {
      if (e.touches.length === 2 && initDist !== null) {
        e.preventDefault();
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const dist = Math.hypot(dx, dy);
        applyZoom(initZoom * (dist / initDist));
      }
    }, { passive: false });

    canvasScroll.addEventListener('touchend', e => {
      if (e.touches.length < 2) initDist = null;
    }, { passive: true });
  })();

  // ── 속지 변경 popup ──────────────────────────────────────────
  (function() {
    const backdrop  = document.getElementById('changeTypeBackdrop');
    const popup     = document.getElementById('changeTypePopup');
    const closeBtn  = document.getElementById('changeTypeClose');
    const itemList  = document.getElementById('ctpItemList');
    let ctpSelected = 0; // index into MP2_ITEMS
    let ctpTargetCard = null; // card to apply type change to (null = use empty card)

    function buildStudyCardInner(isEmpty = true, dateText = null) {
      const el = buildStudyCardEl(isEmpty, dateText);
      el.className = 'study-card-inner';
      el.style.cssText = 'flex:1;min-height:0;display:flex;flex-direction:column;padding:22px;box-sizing:border-box;overflow:hidden;';
      return el;
    }

    function getEmptyCard() {
      return Array.from(canvasScroll.querySelectorAll('.card')).find(c => c.dataset.canvasState === 'empty');
    }

    function applyPageType(idx) {
      const card = ctpTargetCard || getEmptyCard();
      if (!card) return;
      const item = MP2_ITEMS[idx];
      if (!item) return;
      const isStudy = item.cardEl !== undefined;
      const isWithDate = card.dataset.canvasState === 'with-date';
      const existingDate = isWithDate ? (card.dataset.dateText || card.querySelector('.hd-date-val')?.textContent || '') : null;

      card.dataset.pageType = isStudy ? 'study' : 'daily';

      // 캔버스·탭 버튼 외 모든 자식 제거
      const tab = card.querySelector('.page-type-tab');
      Array.from(card.children).forEach(child => {
        if (!child.classList.contains('card-draw-canvas') && child !== tab) {
          child.remove();
        }
      });

      if (isStudy) {
        const inner = isWithDate
          ? buildStudyCardInner(false, `| ${existingDate}`)
          : buildStudyCardInner();
        tab ? card.insertBefore(inner, tab) : card.appendChild(inner);
      } else {
        const inner = document.createElement('div');
        inner.className = 'card-inner';
        inner.innerHTML = `<div class="card-header">
          <div class="hd-left">
            <span class="hd-date-label">Date</span>
            <div class="hd-date-wrap"><span class="hd-date-val${!isWithDate ? ' placeholder' : ''}">${!isWithDate ? '날짜 선택' : existingDate}</span></div>
          </div>
          <div class="hd-right">
            <div class="hd-right-section"><span class="hd-small-label">Dday</span><span class="hd-dday-val">–</span></div>
            <div class="hd-right-section"><span class="hd-small-label">Total Time</span><span class="hd-time-val">–</span></div>
          </div>
        </div>
        <div class="card-gap"></div>
        <div class="list-area">
          <div class="left-panel">${subjGroupsHTML()}</div>
          <div class="panel-gap"></div>
          <div class="right-panel">
            <div class="grid-wrap"><table class="grid-tbl"><tbody></tbody></table></div>
            <div class="grid-bottom-rule"></div>
            <div class="review-bar">
              <span class="review-label">Review.</span>
              <div class="emoji-wrap">
                <div class="emoji-btn">😣</div><div class="emoji-btn">😟</div><div class="emoji-btn">😐</div><div class="emoji-btn">🙂</div><div class="emoji-btn">😊</div>
              </div>
            </div>
          </div>
        </div>`;
        tab ? card.insertBefore(inner, tab) : card.appendChild(inner);
        buildGrid(card, null);
        initEmojiPicker(card);
      }

      if (isWithDate) setTimeout(updateAllThumbs, 50);
    }

    function renderCtpItems() {
      itemList.innerHTML = '';
      MP2_ITEMS.forEach((item, idx) => {
        const el = document.createElement('div');
        el.className = 'ctp-item';
        const thumbInner = document.createElement('div');
        thumbInner.className = 'ctp-thumb-inner';
        const isSelected = idx === ctpSelected;
        el.innerHTML = `
          <div class="ctp-thumb-wrap"></div>
          <div class="ctp-info">
            <div class="ctp-name">${item.name}</div>
          </div>
          <div class="ctp-radio${isSelected ? ' selected' : ''}"></div>
        `;
        el.querySelector('.ctp-thumb-wrap').appendChild(thumbInner);
        const source = item.cardEl !== undefined ? item.cardEl : item.cardIdx;
        if (source !== undefined) setTimeout(() => renderMp2Thumb(source, thumbInner), 0);
        el.addEventListener('click', () => {
          ctpSelected = idx;
          applyPageType(idx);
          closeChangeTypePopup();
        });
        itemList.appendChild(el);
      });
    }

    function openChangeTypePopup(targetCard) {
      ctpTargetCard = targetCard || null;
      const card = ctpTargetCard || getEmptyCard();
      if (card) ctpSelected = card.dataset.pageType === 'study' ? 1 : 0;
      renderCtpItems();
      backdrop.classList.add('visible');
      popup.classList.add('visible');
    }

    function closeChangeTypePopup() {
      backdrop.classList.remove('visible');
      popup.classList.remove('visible');
    }

    window.openChangeTypePopup = openChangeTypePopup;

    closeBtn.addEventListener('click', closeChangeTypePopup);
    backdrop.addEventListener('click', closeChangeTypePopup);

    // Tab button delegation (works for dynamically added cards too)
    canvasScroll.addEventListener('click', e => {
      if (e.target.closest('.page-type-tab')) openChangeTypePopup();
    });
  })();

  // ── 속지 선택 popup (날짜 선택 오버레이의 속지 프리뷰에서 진입) ──────
  (function() {
    const backdrop    = document.getElementById('insertPickerBackdrop');
    const popup       = document.getElementById('insertPickerPopup');
    const slider      = new PanelSlider(document.getElementById('ipSlider'));
    const closeBtn    = document.getElementById('insertPickerClose');
    const grid        = document.getElementById('ipGrid');
    const detailBody  = document.getElementById('ipDetailBody');
    const detailBack  = document.getElementById('ipDetailBack');
    const useBtn      = document.getElementById('ipdUseBtn');
    const colorBackdrop   = document.getElementById('ipColorBackdrop');
    const colorSheet      = document.getElementById('ipColorSheet');
    const colorList       = document.getElementById('ipColorList');
    const colorRow        = document.getElementById('ipdColorRow');
    const colorChipDot    = document.getElementById('ipdColorChipDot');
    const colorChipName   = document.getElementById('ipdColorChipName');

    const IP_COLOR_OPTIONS = [
      { color: '#eee0e5', name: '핑크' },
      { color: '#e2e4df', name: '세이지' },
      { color: '#e4ebb3', name: '라임' },
      { color: '#ede4cb', name: '옐로우' },
      { color: '#d5d0dc', name: '라벤더' },
      { color: '#f2f2f1', name: '그레이' }
    ];
    const IP_UNLOCK_COUNT = 3; // 상단 3개는 잠금 해제
    const IP_ITEMS = Array.from({ length: 9 }, (_, i) => ({
      id: i,
      name: '모던 텐미닛 플래너',
      desc: '심플하고 정돈된 레이아웃으로 하루 학습을 체계적으로 기록할 수 있는 데일리 플래너 속지입니다.',
      unlocked: i < IP_UNLOCK_COUNT
    }));
    const IP_FEATURES = [
      { title: '날짜 선택', desc: '오늘의 학습을 기록할 날짜를 선택하여 하루를 시작하세요' },
      { title: 'Dday', desc: '중요한 시험이나 목표까지 남은 시간을 한눈에 관리해요' },
      { title: '총 공부시간', desc: '오늘 내가 몰입한 총 시간을 직관적으로 확인하세요' },
      { title: '메모', desc: '오늘의 다짐, 기억하고 싶은 아이디어를 자유롭게 채워보세요' }
    ];
    let ipSelectedId = 0;
    let ipActiveId = 0;
    let ipSourceCard = null;
    let ipConfirmedColorIdx = 0; // 실제로 확정 적용된 컬러 (캔버스에 놓일 속지에 반영됨)

    function updateIpColorChip() {
      const opt = IP_COLOR_OPTIONS[ipConfirmedColorIdx];
      colorChipDot.style.background = opt.color;
      colorChipName.textContent = opt.name;
    }

    function getIpItem(id) { return IP_ITEMS.find(it => it.id === id); }
    function isIpUnlocked(id) { const item = getIpItem(id); return !!item && item.unlocked; }

    // 선택된 속지가 항상 맨 앞에 오도록 정렬한 표시 순서
    function getIpDisplayItems() {
      const items = IP_ITEMS.slice();
      const idx = items.findIndex(it => it.id === ipSelectedId);
      if (idx > 0) {
        const [sel] = items.splice(idx, 1);
        items.unshift(sel);
      }
      return items;
    }

    function renderIpGrid() {
      grid.innerHTML = '';
      if (!ipSourceCard) ipSourceCard = buildStudyCardEl();

      getIpDisplayItems().forEach(item => {
        const isSelected = item.id === ipSelectedId;
        const unlocked = item.unlocked;
        const cell = document.createElement('div');
        cell.className = 'ip-cell' + (isSelected ? ' selected' : '') + (unlocked ? '' : ' locked');
        cell.innerHTML = `
          <div class="ip-thumbwrap">
            <div class="ip-thumb-pos">
              <div class="ip-thumb"></div>
              ${isSelected
                ? `<div class="ip-check"><i data-lucide="check" style="width:14px;height:14px;color:white;"></i></div>`
                : (unlocked ? '' : `<div class="ip-lock-badge"><i data-lucide="lock" style="width:12px;height:12px;color:white;"></i></div>`)}
            </div>
          </div>
          <div class="ip-info">
            <div class="ip-name">${item.name}</div>
            <div class="ip-tags">
              ${isSelected
                ? `<div class="ip-tag-selected"><span class="ip-tag-dot" style="background:#ff9a9a;"></span></div>`
                : `<div class="ip-tag-dots">
                     <span class="ip-tag-dot" style="background:#ff9a9a;"></span>
                     <span class="ip-tag-dot" style="background:#ffb86b;"></span>
                     <span class="ip-tag-dot" style="background:#7e96ff;"></span>
                   </div><span class="ip-tag-plus">+2</span>`}
            </div>
          </div>
        `;
        cell.addEventListener('click', () => openIpDetail(item.id));
        grid.appendChild(cell);
        const thumbEl = cell.querySelector('.ip-thumb');
        setTimeout(() => renderMp2Thumb(ipSourceCard, thumbEl), 0);
      });
      if (window.lucide) lucide.createIcons({ nodes: [grid] });
    }

    function renderIpDetail(id) {
      const item = getIpItem(id);
      const isLocked = !item.unlocked;
      detailBody.innerHTML = `
        <div class="ipd-preview-wrap">
          <div class="ipd-preview-thumb" id="ipdPreviewThumb"></div>
          <button class="ipd-expand-btn" id="ipdExpandBtn"><i data-lucide="maximize-2" style="width:14px;height:14px;color:rgba(0,0,0,0.6);"></i></button>
        </div>
        <div>
          <div class="ipd-title">${item.name}</div>
          <div class="ipd-desc">${item.desc}</div>
        </div>
        <div class="ipd-section-title">상세 소개</div>
        <div class="ipd-card">
          <div class="ipd-card-title">다양한 컬러</div>
          <div class="ipd-color-grid" id="ipdColorGrid"></div>
        </div>
        <div class="ipd-card">
          <div class="ipd-card-title">컬러별 다크모드 지원</div>
          <div class="ipd-dark-stack">
            <div class="ipd-dark-thumb ipd-dark-light"><div class="ipd-color-swatch-thumb" id="ipdDarkLight"></div><div class="ipd-color-tint"></div></div>
            <div class="ipd-dark-thumb ipd-dark-dark"><div class="ipd-color-swatch-thumb" id="ipdDarkDark"></div></div>
          </div>
        </div>
        <div class="ipd-features">
          ${IP_FEATURES.map(f => `<div class="ipd-feature"><div class="ipd-feature-title">${f.title}</div><div class="ipd-feature-desc">${f.desc}</div></div>`).join('')}
        </div>
      `;

      const previewThumb = document.getElementById('ipdPreviewThumb');
      setTimeout(() => renderMp2Thumb(ipSourceCard, previewThumb), 0);

      const colorGrid = document.getElementById('ipdColorGrid');
      IP_COLOR_OPTIONS.forEach(opt => {
        const sw = document.createElement('div');
        sw.className = 'ipd-color-swatch';
        sw.innerHTML = `<div class="ipd-color-swatch-thumb"></div><div class="ipd-color-tint" style="background:${opt.color};"></div>`;
        colorGrid.appendChild(sw);
        const thumbEl = sw.querySelector('.ipd-color-swatch-thumb');
        setTimeout(() => renderMp2Thumb(ipSourceCard, thumbEl), 0);
      });

      const darkLight = document.getElementById('ipdDarkLight');
      const darkDark  = document.getElementById('ipdDarkDark');
      setTimeout(() => { renderMp2Thumb(ipSourceCard, darkLight); renderMp2Thumb(ipSourceCard, darkDark); }, 0);

      useBtn.textContent = isLocked ? '잠긴 속지입니다' : '이 속지 사용';
      useBtn.classList.toggle('locked', isLocked);

      if (window.lucide) lucide.createIcons({ nodes: [detailBody] });
    }

    function renderIpColorSheet() {
      colorList.innerHTML = '';
      IP_COLOR_OPTIONS.forEach((opt, idx) => {
        const row = document.createElement('div');
        row.className = 'ipcs-row';
        row.innerHTML = `
          <div class="ipcs-thumb"><div class="ipcs-thumb-inner"></div><div class="ipcs-thumb-tint" style="background:${opt.color};"></div></div>
          <div class="ipcs-name">${opt.name}</div>
          <div class="ctp-radio${idx === ipConfirmedColorIdx ? ' selected' : ''}"></div>
        `;
        row.addEventListener('click', () => {
          ipConfirmedColorIdx = idx;
          closeIpColorSheet();
          updateIpColorChip();
        });
        colorList.appendChild(row);
        const thumbEl = row.querySelector('.ipcs-thumb-inner');
        setTimeout(() => renderMp2Thumb(ipSourceCard, thumbEl), 0);
      });
    }

    function openIpColorSheet() {
      renderIpColorSheet();
      colorBackdrop.classList.add('open');
      colorSheet.classList.add('open');
    }

    // 현재 확정된 템플릿+컬러를 반영한 미리보기용 카드 엘리먼트 (실제 캔버스엔 붙지 않음)
    function buildIpConfiguredCardEl() {
      const el = buildStudyCardEl();
      el.style.position = 'relative';
      el.style.overflow = 'hidden';
      const tint = document.createElement('div');
      tint.style.cssText = `position:absolute;inset:0;mix-blend-mode:multiply;opacity:0.5;pointer-events:none;background:${IP_COLOR_OPTIONS[ipConfirmedColorIdx].color};`;
      el.appendChild(tint);
      return el;
    }
    window.ipBuildConfiguredCardEl = buildIpConfiguredCardEl;

    // 실제 캔버스 카드에 확정된 컬러를 입힘 (createPage에서 호출)
    function applyIpTintToCard(cardEl) {
      const tint = document.createElement('div');
      tint.className = 'ip-applied-tint';
      tint.style.cssText = `position:absolute;inset:0;mix-blend-mode:multiply;opacity:0.5;pointer-events:none;background:${IP_COLOR_OPTIONS[ipConfirmedColorIdx].color};`;
      cardEl.appendChild(tint);
    }
    window.ipApplyTint = applyIpTintToCard;

    function closeIpColorSheet() {
      colorBackdrop.classList.remove('open');
      colorSheet.classList.remove('open');
    }

    function openIpDetail(id) {
      ipActiveId = id;
      renderIpDetail(id);
      updateIpColorChip();
      detailBody.scrollTop = 0;
      setTimeout(() => { detailBody.scrollTop = 0; }, 0);
      slider.goTo(1);
    }

    function closeIpDetail() {
      slider.goTo(0);
    }

    function openInsertPicker(targetCard) {
      ipSourceCard = targetCard || null;
      slider.reset(0);
      colorSheet.style.transition = 'none';
      closeIpColorSheet();
      setTimeout(() => { colorSheet.style.transition = ''; }, 10);
      renderIpGrid();
      backdrop.classList.add('visible');
      popup.classList.add('visible');
    }

    function closeInsertPicker() {
      backdrop.classList.remove('visible');
      popup.classList.remove('visible');
      // 팝업이 완전히 닫히고 캔버스로 돌아왔으니, 대기 중이던 날짜 선택 오버레이를 다시 띄움
      if (typeof window.onInsertPickerClosed === 'function') window.onInsertPickerClosed();
    }

    window.openInsertPicker = openInsertPicker;

    closeBtn.addEventListener('click', closeInsertPicker);
    backdrop.addEventListener('click', closeInsertPicker);
    detailBack.addEventListener('click', closeIpDetail);
    colorBackdrop.addEventListener('click', closeIpColorSheet);
    colorRow.addEventListener('click', openIpColorSheet);

    useBtn.addEventListener('click', () => {
      if (!isIpUnlocked(ipActiveId)) return; // locked: no-op
      ipSelectedId = ipActiveId;
      closeInsertPicker();
      pageToast.show('속지가 설정되었습니다');
    });
  })();
</script>
</body>
</html>
