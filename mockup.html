<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pad — 목업</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      /* 어두운 무대 — 가운데 목업만 떠 보이게 */
      background: radial-gradient(120% 100% at 50% 0%, #26262c 0%, #17171b 55%, #101014 100%);
      color: #fff;
      -webkit-font-smoothing: antialiased;
    }

    /* ── 무대 ──────────────────────────────────────────────── */
    .stage {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      padding: 24px 24px 108px; /* 아래 툴바·라벨 자리 */
      /* 세로로 돌려 창보다 커지면 축소하지 않고 스크롤한다 (.rail의 margin:auto가 중앙 정렬을
         유지하면서도 넘칠 때 위쪽이 잘리지 않게 해준다) */
      overflow: auto;
    }
    .stage::-webkit-scrollbar { width: 8px; height: 8px; }
    .stage::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.16); border-radius: 100px; }
    /* 전체 나열 — 왼쪽부터 오른쪽으로 쭉 늘어놓고 가로 스크롤 */
    .stage.gallery { justify-content: flex-start; overflow-x: auto; overflow-y: hidden; }
    .stage.gallery::-webkit-scrollbar { height: 8px; }
    .stage.gallery::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.16); border-radius: 100px; }
    .rail { display: flex; align-items: center; gap: 56px; margin: auto; }
    .stage.gallery .rail { margin: auto 8px; }

    /* 축소된 목업이 차지하는 자리 — 안쪽은 transform으로 줄인다 */
    .dev-slot { position: relative; flex-shrink: 0; }
    .dev-inner { position: absolute; left: 0; top: 0; transform-origin: top left; }
    .dev-label {
      position: absolute; left: -20px; right: -20px; bottom: -28px;
      text-align: center; white-space: nowrap;
      font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.5); letter-spacing: -0.039px;
    }
    .dev-label b { font-weight: 600; color: rgba(255,255,255,0.78); }

    /* ── 디바이스 목업 ─────────────────────────────────────── */
    .device {
      position: relative;
      padding: var(--bezel);
      border-radius: var(--radius);
      background: linear-gradient(160deg, #3a3a40, #202024 40%, #17171a);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.06) inset,
        0 2px 0 rgba(255,255,255,0.10) inset,
        0 40px 90px rgba(0,0,0,0.55),
        0 8px 24px rgba(0,0,0,0.4);
    }
    /* 베젤 안쪽 얇은 테두리 — 유리면 경계 */
    .device::after {
      content: '';
      position: absolute; inset: calc(var(--bezel) - 3px);
      border-radius: calc(var(--radius) - var(--bezel) + 3px);
      box-shadow: 0 0 0 1px rgba(0,0,0,0.6), 0 0 0 2px rgba(255,255,255,0.05);
      pointer-events: none;
    }
    .device-screen {
      position: relative;
      width: var(--w); height: var(--h);
      border-radius: calc(var(--radius) - var(--bezel));
      overflow: hidden;
      background: #e0e0e0;
    }
    .device-screen iframe { display: block; width: 100%; height: 100%; border: 0; }
    /* 전면 카메라 — 긴 변(가로일 때 위쪽) 가운데 */
    .device-cam {
      position: absolute; z-index: 2;
      width: 7px; height: 7px; border-radius: 50%;
      background: #0c0c0e;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.08), inset 0 0 3px rgba(80,140,255,0.35);
      left: 50%; top: calc(var(--bezel) / 2); transform: translate(-50%, -50%);
    }
    /* 홈 인디케이터 — 아래 베젤 가운데 */
    .device-home {
      position: absolute; z-index: 2;
      left: 50%; bottom: calc(var(--bezel) / 2 - 2px); transform: translateX(-50%);
      width: 118px; height: 4px; border-radius: 100px;
      background: rgba(255,255,255,0.18);
    }

    /* ── 아래 툴바 ─────────────────────────────────────────── */
    .bar {
      position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
      display: flex; align-items: center; gap: 8px;
      padding: 8px; border-radius: 100px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.10);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.45);
      z-index: 10;
    }
    .bar select, .bar button {
      height: 36px; border-radius: 100px; border: none; cursor: pointer;
      font-family: 'Pretendard', sans-serif; font-size: 14px; font-weight: 600;
      letter-spacing: -0.042px; color: rgba(255,255,255,0.92);
      background: rgba(255,255,255,0.10);
      -webkit-tap-highlight-color: transparent;
    }
    .bar select { padding: 0 34px 0 14px; appearance: none; -webkit-appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
      background-repeat: no-repeat; background-position: right 12px center;
    }
    .bar select option { color: #111; }
    .bar select:disabled { opacity: 0.35; cursor: default; }
    .bar button { padding: 0 14px; display: flex; align-items: center; gap: 6px; }
    .bar select:hover, .bar button:hover { background: rgba(255,255,255,0.18); }
    .bar button.on { background: #fff; color: rgba(0,0,0,0.86); }
    .bar .size {
      padding: 0 12px; font-size: 13px; font-weight: 500;
      color: rgba(255,255,255,0.55); font-variant-numeric: tabular-nums; white-space: nowrap;
    }
    .bar svg { width: 16px; height: 16px; flex-shrink: 0; }
  </style>
</head>
<body>

  <div class="stage" id="stage">
    <div class="rail" id="rail"></div>
  </div>

  <div class="bar">
    <select id="deviceSel" aria-label="디바이스"></select>
    <button id="galleryBtn" type="button" title="모든 기기를 나열 (A)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="6" width="6" height="12" rx="1.5"/><rect x="10" y="4" width="7" height="16" rx="1.5"/><rect x="19" y="7" width="4" height="10" rx="1.5"/>
      </svg>
      <span>전체 나열</span>
    </button>
    <select id="pageModeSel" aria-label="속지 규격" title="캔버스에 놓이는 속지 크기 (F로 순환)">
      <option value="native">속지 제 규격</option>
      <option value="fit">가로 폭 맞춤</option>
      <option value="fill">가로 폭 채움</option>
    </select>
    <button id="rotateBtn" type="button" title="가로/세로 전환 (R)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/>
        <path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
      </svg>
      <span id="rotateLabel">세로로</span>
    </button>
    <button id="reloadBtn" type="button" title="화면 새로고침">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>
      </svg>
    </button>
    <span class="size" id="sizeLabel"></span>
  </div>

<script>
  // 기기 목록 — 실제 해상도(px)와 화면 대각(인치)을 그대로 적어두고,
  // 앱이 보는 화면 크기(pt)는 해상도 ÷ 픽셀 배율로 계산한다.
  // 목업이 화면에 그려지는 크기는 "실제 물리 크기"에 비례한다 (mini가 Pro보다 작게 보이도록).
  const DEVICES = [
    { id: 'ipad',       name: 'iPad',                 resW: 2360, resH: 1640, diag: 10.86, dpr: 2, bezel: 22, radius: 40 },
    { id: 'ipadmini',   name: 'iPad mini',            resW: 2266, resH: 1488, diag: 8.3,   dpr: 2, bezel: 18, radius: 34 },
    { id: 'air11',      name: 'iPad Air 11',          resW: 2360, resH: 1640, diag: 10.86, dpr: 2, bezel: 21, radius: 38 },
    { id: 'air13',      name: 'iPad Air 13',          resW: 2732, resH: 2048, diag: 12.91, dpr: 2, bezel: 22, radius: 42 },
    { id: 'pro11',      name: 'iPad Pro 11',          resW: 2420, resH: 1668, diag: 11.11, dpr: 2, bezel: 19, radius: 40 },
    { id: 'pro13',      name: 'iPad Pro 13',          resW: 2752, resH: 2064, diag: 13,    dpr: 2, bezel: 20, radius: 44 },
    { id: 'tabs11',     name: 'Galaxy Tab S11',       resW: 2560, resH: 1600, diag: 11,    dpr: 2, bezel: 17, radius: 26 },
    { id: 'tabs11u',    name: 'Galaxy Tab S11 Ultra', resW: 2960, resH: 1848, diag: 14.6,  dpr: 2, bezel: 17, radius: 28 },
    { id: 'tabs10fe',   name: 'Galaxy Tab S10 FE',    resW: 2503, resH: 1440, diag: 10.9,  dpr: 2, bezel: 20, radius: 24 },
    { id: 'tabs10fep',  name: 'Galaxy Tab S10 FE+',   resW: 2880, resH: 1800, diag: 13.1,  dpr: 2, bezel: 20, radius: 26 },
    { id: 'tabs10u',    name: 'Galaxy Tab S10 Ultra', resW: 2960, resH: 1848, diag: 14.6,  dpr: 2, bezel: 17, radius: 28 },
  ];
  const PX_PER_INCH = 96; // 무대에서 실물 1인치를 몇 px로 그릴지 (기기 간 크기 비교의 기준)
  const APP_URL = 'study-planner.html';

  // 화면 대각(인치)과 해상도 비율로 실제 가로/세로 인치를 구한다
  DEVICES.forEach(d => {
    const diagPx = Math.hypot(d.resW, d.resH);
    d.inW = d.diag * d.resW / diagPx;
    d.inH = d.diag * d.resH / diagPx;
    d.w = Math.round(d.resW / d.dpr); // 앱이 보는 가로 pt
    d.h = Math.round(d.resH / d.dpr); // 앱이 보는 세로 pt
  });

  const $ = id => document.getElementById(id);
  const stage = $('stage'), rail = $('rail');

  // 앱이 1366×1024 기준으로 만들어져 있어 13" 모델로 시작한다
  let devIdx = Math.max(0, DEVICES.findIndex(d => d.id === 'pro13'));
  let landscape = true, gallery = false, pageMode = 'native'; // native | fit | fill

  // 저장해둔 선택 복원
  try {
    const saved = JSON.parse(localStorage.getItem('pad4-mockup') || '{}');
    const i = DEVICES.findIndex(d => d.id === saved.device);
    if (i >= 0) devIdx = i;
    if (typeof saved.landscape === 'boolean') landscape = saved.landscape;
    if (typeof saved.gallery === 'boolean') gallery = saved.gallery;
    if (['native', 'fit', 'fill'].includes(saved.pageMode)) pageMode = saved.pageMode;
  } catch (e) {}

  DEVICES.forEach((d, i) => {
    const o = document.createElement('option');
    o.value = String(i);
    o.textContent = d.name;
    $('deviceSel').appendChild(o);
  });

  // ── 목업 한 대 만들기 ────────────────────────────────────
  function makeDevice(d, withLabel) {
    const slot = document.createElement('div');
    slot.className = 'dev-slot';
    slot.dataset.id = d.id;
    slot.innerHTML = `
      <div class="dev-inner">
        <div class="device">
          <div class="device-screen"><iframe src="${APP_URL}" title="${d.name}"></iframe></div>
          <div class="device-cam"></div>
          <div class="device-home"></div>
        </div>
      </div>
      ${withLabel ? `<div class="dev-label"><b>${d.name}</b></div>` : ''}
    `;
    return slot;
  }

  // 목업 하나의 크기·배율을 다시 잡는다. extraFit은 창에 맞추기 위한 추가 축소.
  function layoutDevice(slot, d, extraFit) {
    const w = landscape ? d.w : d.h;
    const h = landscape ? d.h : d.w;
    const inW = landscape ? d.inW : d.inH;

    const device = slot.querySelector('.device');
    device.style.setProperty('--w', w + 'px');
    device.style.setProperty('--h', h + 'px');
    device.style.setProperty('--bezel', d.bezel + 'px');
    device.style.setProperty('--radius', d.radius + 'px');

    // 실물 크기 배율 — 같은 무대에서 mini는 Pro보다 실제 비율만큼 작아진다
    const real = (inW * PX_PER_INCH) / w;
    const s = real * extraFit;
    const outerW = (w + d.bezel * 2) * s, outerH = (h + d.bezel * 2) * s;

    slot.style.width = outerW + 'px';
    slot.style.height = outerH + 'px';
    slot.querySelector('.dev-inner').style.transform = `scale(${s})`;
    return { outerW, outerH, real };
  }

  // 창에 들어가도록 하는 추가 축소값 (배율은 기기 간 비율을 지키려고 전부 같은 값을 쓴다).
  // 실제 기기는 돌린다고 작아지지 않으므로, 이 값은 항상 "가로 상태" 기준으로만 정한다.
  // 세로로 돌려 창을 넘치면 배율을 줄이는 대신 무대를 스크롤한다.
  function fitFor(list) {
    let maxW = 0, maxH = 0;
    list.forEach(d => {
      const real = (d.inW * PX_PER_INCH) / d.w; // 방향과 무관한 실물 배율
      const ow = (d.w + d.bezel * 2) * real, oh = (d.h + d.bezel * 2) * real;
      // 돌려도 배율이 변하지 않으면서 두 방향 모두 화면에 들어오도록,
      // 긴 변(회전해도 그대로인 외접 정사각형)을 기준으로 잡는다
      const side = Math.max(ow, oh);
      maxW = Math.max(maxW, side); maxH = Math.max(maxH, side);
    });
    const availH = window.innerHeight - (gallery ? 190 : 132);
    // 전체 나열은 가로로 스크롤하므로 높이만 맞춘다
    return gallery
      ? Math.min(1, availH / maxH)
      : Math.min(1, (window.innerWidth - 72) / maxW, availH / maxH);
  }

  function render() {
    const list = gallery ? DEVICES : [DEVICES[devIdx]];
    const fit = fitFor(list);
    const cur = DEVICES[devIdx];

    // iframe은 DOM에서 옮기거나 다시 만들면 페이지가 새로 로드된다 —
    // 그래서 이미 있는 슬롯은 절대 옮기지 않고, 기기를 바꿀 때도 슬롯을 재사용한다.
    if (!gallery) {
      // 단일 모드 — 슬롯 하나만 남기고 기기만 갈아 끼운다 (화면 내용 유지)
      let slot = rail.querySelector(`.dev-slot[data-id="${cur.id}"]`) || rail.firstElementChild;
      if (!slot) { slot = makeDevice(cur, false); rail.appendChild(slot); }
      Array.from(rail.children).forEach(el => { if (el !== slot) el.remove(); });
      slot.dataset.id = cur.id;
      slot.querySelector('.dev-label')?.remove();
      layoutDevice(slot, cur, fit);
    } else {
      // 전체 나열 — 없는 기기만 새로 만들어 순서대로 끼워 넣는다
      let prev = null;
      DEVICES.forEach(d => {
        let slot = rail.querySelector(`.dev-slot[data-id="${d.id}"]`);
        if (!slot) {
          slot = makeDevice(d, true);
          if (prev) prev.after(slot); else rail.prepend(slot);
        } else if (!slot.querySelector('.dev-label')) {
          slot.insertAdjacentHTML('beforeend', `<div class="dev-label"><b>${d.name}</b></div>`);
        }
        prev = slot;
        layoutDevice(slot, d, fit);
      });
    }

    stage.classList.toggle('gallery', gallery);
    $('galleryBtn').classList.toggle('on', gallery);
    $('pageModeSel').value = pageMode;
    $('deviceSel').disabled = gallery;
    $('deviceSel').value = String(devIdx);
    $('rotateLabel').textContent = landscape ? '세로로' : '가로로';

    const w = landscape ? cur.w : cur.h, h = landscape ? cur.h : cur.w;
    $('sizeLabel').textContent = gallery ? `${DEVICES.length}대  ·  ${Math.round(fit * 100)}%` : `${w} × ${h}`;
    $('sizeLabel').title = gallery ? '' : `${landscape ? cur.resW : cur.resH} × ${landscape ? cur.resH : cur.resW}px · ${cur.diag}"`;

    try {
      localStorage.setItem('pad4-mockup', JSON.stringify({ device: cur.id, landscape, gallery, pageMode }));
    } catch (e) {}
  }

  // 앱에 현재 속지 규격 모드를 알린다
  function sendMode(target) {
    const msg = { padMode: pageMode };
    if (target) { target.postMessage(msg, '*'); return; }
    rail.querySelectorAll('iframe').forEach(f => { if (f.contentWindow) f.contentWindow.postMessage(msg, '*'); });
  }

  // ── 화면 싱크 ───────────────────────────────────────────
  // 앱 안의 작은 에이전트가 클릭·입력을 올려보내면, 여기서 나머지 기기에 그대로 전달한다.
  window.addEventListener('message', e => {
    const m = e.data;
    if (!m) return;
    // 목업 위(=iframe 위)에서 굴린 휠은 앱이 부모로 넘겨준다 — 무대를 대신 스크롤한다.
    // 단 전체 나열에서는 기기 안 스크롤이 끝나도 무대를 움직이지 않는다(기기 안은 기기 안에서만).
    // 앱이 막 떴다고 알려오면 현재 모드를 내려보낸다
    if (m.padReady) { sendMode(e.source); return; }
    if (m.padWheel) {
      if (!gallery) { stage.scrollTop += (m.dy || 0); stage.scrollLeft += (m.dx || 0); }
      return;
    }
    if (!m.padSync) return;
    rail.querySelectorAll('iframe').forEach(f => {
      if (f.contentWindow && f.contentWindow !== e.source) f.contentWindow.postMessage(m, '*');
    });
  });

  // 전체 나열에서는 무대 배경 위 휠을 가로 이동으로 (기기 밖에서만 동작한다)
  stage.addEventListener('wheel', e => {
    if (!gallery) return;
    const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    if (!d) return;
    stage.scrollLeft += d;
    e.preventDefault();
  }, { passive: false });

  // 무대 배경을 끌어서 이동 (목업 위에서는 드래그가 앱으로 가므로 배경에서만)
  let panning = null;
  stage.addEventListener('mousedown', e => {
    if (e.target.closest('.dev-slot')) return;
    panning = { x: e.clientX, y: e.clientY, l: stage.scrollLeft, t: stage.scrollTop };
  });
  window.addEventListener('mousemove', e => {
    if (!panning) return;
    stage.scrollLeft = panning.l - (e.clientX - panning.x);
    stage.scrollTop  = panning.t - (e.clientY - panning.y);
  });
  window.addEventListener('mouseup', () => { panning = null; });

  $('deviceSel').addEventListener('change', e => { devIdx = +e.target.value; render(); });
  $('galleryBtn').addEventListener('click', () => { gallery = !gallery; stage.scrollLeft = 0; render(); });
  $('pageModeSel').addEventListener('change', e => { pageMode = e.target.value; render(); sendMode(); });
  $('rotateBtn').addEventListener('click', () => { landscape = !landscape; render(); });
  $('reloadBtn').addEventListener('click', () => {
    rail.querySelectorAll('iframe').forEach(f => { f.src = f.src; });
  });
  window.addEventListener('resize', render);
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'SELECT') return;
    if (e.key === 'r' || e.key === 'R') { landscape = !landscape; render(); }
    if (e.key === 'a' || e.key === 'A') { gallery = !gallery; stage.scrollLeft = 0; render(); }
    if (e.key === 'f' || e.key === 'F') {
      const order = ['native', 'fit', 'fill'];
      pageMode = order[(order.indexOf(pageMode) + 1) % order.length];
      render(); sendMode();
    }
  });

  render();
</script>
</body>
</html>
