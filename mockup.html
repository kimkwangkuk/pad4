<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pad — 목업</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      /* 어두운 무대 — 가운데 목업만 떠 보이게 */
      background: radial-gradient(120% 100% at 50% 0%, #26262c 0%, #17171b 55%, #101014 100%);
      color: #fff;
      -webkit-font-smoothing: antialiased;
    }

    /* ── 무대: 목업을 화면 정중앙에 둔다 ───────────────────── */
    .stage {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      padding-bottom: 40px; /* 아래 툴바 자리만큼 위로 */
    }
    /* 창 크기에 맞춰 통째로 축소된다 (iframe 안이라 좌표 계산에 영향이 없다) */
    .device-wrap { transform-origin: center center; transition: transform 0.25s ease; }

    /* ── 디바이스 목업 ─────────────────────────────────────── */
    .device {
      position: relative;
      padding: var(--bezel);
      border-radius: var(--radius);
      background: linear-gradient(160deg, #3a3a40, #202024 40%, #17171a);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.06) inset,
        0 2px 0 rgba(255,255,255,0.10) inset,
        0 40px 90px rgba(0,0,0,0.55),
        0 8px 24px rgba(0,0,0,0.4);
      transition: padding 0.25s ease, border-radius 0.25s ease;
    }
    /* 베젤 안쪽 얇은 테두리 — 유리면 경계 */
    .device::after {
      content: '';
      position: absolute; inset: calc(var(--bezel) - 3px);
      border-radius: calc(var(--radius) - var(--bezel) + 3px);
      box-shadow: 0 0 0 1px rgba(0,0,0,0.6), 0 0 0 2px rgba(255,255,255,0.05);
      pointer-events: none;
    }
    .device-screen {
      position: relative;
      width: var(--w); height: var(--h);
      border-radius: calc(var(--radius) - var(--bezel));
      overflow: hidden;
      background: #e0e0e0;
      transition: width 0.25s ease, height 0.25s ease, border-radius 0.25s ease;
    }
    .device-screen iframe {
      display: block; width: 100%; height: 100%; border: 0;
    }
    /* 전면 카메라 — 긴 변(가로일 때 위쪽) 가운데 */
    .device-cam {
      position: absolute; z-index: 2;
      width: 7px; height: 7px; border-radius: 50%;
      background: #0c0c0e;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.08), inset 0 0 3px rgba(80,140,255,0.35);
      left: 50%; top: calc(var(--bezel) / 2); transform: translate(-50%, -50%);
    }
    /* 홈 인디케이터 — 아래 베젤 가운데 */
    .device-home {
      position: absolute; z-index: 2;
      left: 50%; bottom: calc(var(--bezel) / 2 - 2px); transform: translateX(-50%);
      width: 118px; height: 4px; border-radius: 100px;
      background: rgba(255,255,255,0.18);
    }

    /* ── 아래 툴바 ─────────────────────────────────────────── */
    .bar {
      position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
      display: flex; align-items: center; gap: 8px;
      padding: 8px; border-radius: 100px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.10);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.45);
      z-index: 10;
    }
    .bar select, .bar button {
      height: 36px; border-radius: 100px; border: none; cursor: pointer;
      font-family: 'Pretendard', sans-serif; font-size: 14px; font-weight: 600;
      letter-spacing: -0.042px; color: rgba(255,255,255,0.92);
      background: rgba(255,255,255,0.10);
      -webkit-tap-highlight-color: transparent;
    }
    .bar select { padding: 0 34px 0 14px; appearance: none; -webkit-appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
      background-repeat: no-repeat; background-position: right 12px center;
    }
    .bar select option { color: #111; }
    .bar button { padding: 0 14px; display: flex; align-items: center; gap: 6px; }
    .bar select:hover, .bar button:hover { background: rgba(255,255,255,0.18); }
    .bar .size {
      padding: 0 12px; font-size: 13px; font-weight: 500;
      color: rgba(255,255,255,0.55); font-variant-numeric: tabular-nums; white-space: nowrap;
    }
    .bar svg { width: 16px; height: 16px; flex-shrink: 0; }
  </style>
</head>
<body>

  <div class="stage">
    <div class="device-wrap" id="deviceWrap">
      <div class="device" id="device">
        <div class="device-screen">
          <iframe id="appFrame" src="study-planner.html" title="Pad UI"></iframe>
        </div>
        <div class="device-cam"></div>
        <div class="device-home"></div>
      </div>
    </div>
  </div>

  <div class="bar">
    <select id="deviceSel" aria-label="디바이스"></select>
    <button id="rotateBtn" type="button" title="가로/세로 전환 (R)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/>
        <path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
      </svg>
      <span id="rotateLabel">세로로</span>
    </button>
    <button id="reloadBtn" type="button" title="화면 새로고침">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>
      </svg>
    </button>
    <span class="size" id="sizeLabel"></span>
  </div>

<script>
  // 기기 목록 — 실제 해상도(px)와 화면 대각(인치)을 그대로 적어두고,
  // 앱이 보는 화면 크기(pt)는 해상도 ÷ 픽셀 배율로 계산한다.
  // 목업이 화면에 그려지는 크기는 "실제 물리 크기"에 비례한다 (mini가 Pro보다 작게 보이도록).
  const DEVICES = [
    { id: 'ipad',       name: 'iPad',                 resW: 2360, resH: 1640, diag: 10.86, dpr: 2, bezel: 22, radius: 40 },
    { id: 'ipadmini',   name: 'iPad mini',            resW: 2266, resH: 1488, diag: 8.3,   dpr: 2, bezel: 18, radius: 34 },
    { id: 'air11',      name: 'iPad Air 11',          resW: 2360, resH: 1640, diag: 10.86, dpr: 2, bezel: 21, radius: 38 },
    { id: 'air13',      name: 'iPad Air 13',          resW: 2732, resH: 2048, diag: 12.91, dpr: 2, bezel: 22, radius: 42 },
    { id: 'pro11',      name: 'iPad Pro 11',          resW: 2420, resH: 1668, diag: 11.11, dpr: 2, bezel: 19, radius: 40 },
    { id: 'pro13',      name: 'iPad Pro 13',          resW: 2752, resH: 2064, diag: 13,    dpr: 2, bezel: 20, radius: 44 },
    { id: 'tabs11',     name: 'Galaxy Tab S11',       resW: 2560, resH: 1600, diag: 11,    dpr: 2, bezel: 17, radius: 26 },
    { id: 'tabs11u',    name: 'Galaxy Tab S11 Ultra', resW: 2960, resH: 1848, diag: 14.6,  dpr: 2, bezel: 17, radius: 28 },
    { id: 'tabs10fe',   name: 'Galaxy Tab S10 FE',    resW: 2503, resH: 1440, diag: 10.9,  dpr: 2, bezel: 20, radius: 24 },
    { id: 'tabs10fep',  name: 'Galaxy Tab S10 FE+',   resW: 2880, resH: 1800, diag: 13.1,  dpr: 2, bezel: 20, radius: 26 },
    { id: 'tabs10u',    name: 'Galaxy Tab S10 Ultra', resW: 2960, resH: 1848, diag: 14.6,  dpr: 2, bezel: 17, radius: 28 },
  ];
  const PX_PER_INCH = 96; // 무대에서 실물 1인치를 몇 px로 그릴지 (기기 간 크기 비교의 기준)

  // 화면 대각(인치)과 해상도 비율로 실제 가로/세로 인치를 구한다
  DEVICES.forEach(d => {
    const diagPx = Math.hypot(d.resW, d.resH);
    d.inW = d.diag * d.resW / diagPx;
    d.inH = d.diag * d.resH / diagPx;
    d.w = Math.round(d.resW / d.dpr); // 앱이 보는 가로 pt
    d.h = Math.round(d.resH / d.dpr); // 앱이 보는 세로 pt
  });

  const $ = id => document.getElementById(id);
  const wrap = $('deviceWrap'), device = $('device'), frame = $('appFrame');

  // 앱이 1366×1024 기준으로 만들어져 있어 13" 모델로 시작한다
  let devIdx = Math.max(0, DEVICES.findIndex(d => d.id === 'pro13')), landscape = true;

  // 저장해둔 선택 복원
  try {
    const saved = JSON.parse(localStorage.getItem('pad4-mockup') || '{}');
    const i = DEVICES.findIndex(d => d.id === saved.device);
    if (i >= 0) devIdx = i;
    if (typeof saved.landscape === 'boolean') landscape = saved.landscape;
  } catch (e) {}

  // 디바이스 목록
  DEVICES.forEach((d, i) => {
    const o = document.createElement('option');
    o.value = String(i);
    o.textContent = d.name;
    $('deviceSel').appendChild(o);
  });

  function apply() {
    const d = DEVICES[devIdx];
    const w = landscape ? d.w : d.h;
    const h = landscape ? d.h : d.w;
    const inW = landscape ? d.inW : d.inH;
    const inH = landscape ? d.inH : d.inW;

    device.style.setProperty('--w', w + 'px');
    device.style.setProperty('--h', h + 'px');
    device.style.setProperty('--bezel', d.bezel + 'px');
    device.style.setProperty('--radius', d.radius + 'px');

    // 기기마다 "실물 크기 ÷ 화면 pt"만큼 축소해서 그린다 —
    // 같은 무대에 놓으면 mini는 Pro보다 실제 비율만큼 작아 보인다.
    const real = (inW * PX_PER_INCH) / w;
    // 창에 들어가도록 한 번 더 줄인다 (실물 배율보다 키우지는 않는다)
    const outerW = (w + d.bezel * 2) * real, outerH = (h + d.bezel * 2) * real;
    const fit = Math.min(1, (window.innerWidth - 72) / outerW, (window.innerHeight - 132) / outerH);
    wrap.style.transform = `scale(${real * fit})`;

    $('deviceSel').value = String(devIdx);
    $('sizeLabel').textContent = `${w} × ${h}`;
    $('sizeLabel').title = `${landscape ? d.resW : d.resH} × ${landscape ? d.resH : d.resW}px · ${d.diag}"`;
    $('rotateLabel').textContent = landscape ? '세로로' : '가로로';

    try {
      localStorage.setItem('pad4-mockup', JSON.stringify({ device: d.id, landscape }));
    } catch (e) {}
  }

  $('deviceSel').addEventListener('change', e => { devIdx = +e.target.value; apply(); });
  $('rotateBtn').addEventListener('click', () => { landscape = !landscape; apply(); });
  // file://로 열면 iframe이 다른 오리진 취급이라 contentWindow를 못 만진다 — src를 다시 넣는다
  $('reloadBtn').addEventListener('click', () => { frame.src = frame.src; });
  window.addEventListener('resize', apply);
  document.addEventListener('keydown', e => {
    if (e.key === 'r' || e.key === 'R') { landscape = !landscape; apply(); }
  });

  apply();
</script>
</body>
</html>
